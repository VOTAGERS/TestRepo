# .github/workflows/build.yml
name: Build and Push Image

on:
  push:
    branches:
      - 'origin-*'
      - '!main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Dev
    outputs:
      branch_name: ${{ steps.meta.outputs.branch_name }}
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      container_name: ${{ steps.meta.outputs.CONTAINER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Image Tag and Container Name
        id: meta
        run: |
          DATE=$(date +%m%d%H%M)
          SHA=$(echo ${{ github.sha }} | cut -c1-5)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')

          TAG="${BRANCH}-${DATE}-${SHA}"
          CONTAINER_NAME="votagers-${BRANCH}"

          echo "BRANCH_NAMR=${BRANCH}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "CONTAINER_NAME=${CONTAINER_NAME}" >> $GITHUB_OUTPUT

          echo "Generated: BRANCH_NAME=${BRANCH}"
          echo "Generated: IMAGE_TAG=${TAG}"
          echo "Generated: CONTAINER_NAME=${CONTAINER_NAME}"

      - name: Build and Push to Docker Hub
        run: |
          FULL_IMAGE="${DOCKER_REPO}:${IMAGE_TAG}"
          docker build -t "${FULL_IMAGE}" .
          docker push "${FULL_IMAGE}"
        env:
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}

  call-deploy:
    needs: build
    uses: ./.github/workflows/deployment.yml
    with:
      branch_name: ${{ needs.build.outputs.branch_name }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      container_name: ${{ needs.build.outputs.container_name }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      ACC_TOKEN: ${{ secrets.ACC_TOKEN }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      AUTH_CLIENT_URL: ${{ secrets.AUTH_CLIENT_URL }}
      DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
