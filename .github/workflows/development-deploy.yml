name: Deploy Platforms App
#InActive
on:
  # push:
  #   branches:
  #     - 'origin-*'
  #     - '!main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Get current date and commit SHA for image tagging
        id: get_version
        run: |
          CLEANED_BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g' | tr -cd '[:alnum:]._-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]\+/-/g')
          if [ -z "$CLEANED_BRANCH_NAME" ]; then
            CLEANED_BRANCH_NAME="default-branch"
          fi
          DATE=$(date +%m%d%H%M)
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          IMAGE_TAG="${CLEANED_BRANCH_NAME}-${DATE}-${SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"
          echo "Current branch: ${{ github.ref_name }}"

      - name: Build and push Docker image to Docker Hub
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_REPO }}:${{ steps.get_version.outputs.IMAGE_TAG }}"
          echo "Building image: $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
          echo "${IMAGE_NAME}" > image_to_deploy.txt
      
      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_to_deploy.txt
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - name: Download image tag artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tag
          path: .

      - name: Read check image tag
        id: read_image
        run: |
          IMAGE=$(cat image_to_deploy.txt | tr -d '\n\r' | xargs)
          if [ -z "$IMAGE" ]; then
            echo "❌ ERROR: IMAGE_TO_DEPLOY is empty!"
            exit 1
          fi
          echo "✅ IMAGE_TO_DEPLOY read: $IMAGE"
          echo "IMAGE_TO_DEPLOY=$IMAGE" >> $GITHUB_ENV
          echo "IMAGE_TO_DEPLOY=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TO_DEPLOY: ${{ env.IMAGE_TO_DEPLOY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TO_DEPLOY,FIREBASE_SERVICE_ACCOUNT_JSON
          script: |
            echo "Starting deployment on EC2..."
            CONTAINER_NAME="votagers-platforms"

            echo "Stopping and removing old container: ${CONTAINER_NAME}"
            docker stop "${CONTAINER_NAME}" || true
            docker rm "${CONTAINER_NAME}" || true

            echo "Pulling new image: ${IMAGE_TO_DEPLOY}"
            docker pull "${IMAGE_TO_DEPLOY}"

            # --- Bersihkan semua Environment Variables ---
            NODE_ENV_CLEAN=$(echo "development" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            ORGS_NAME_CLEAN=$(echo "${{ vars.ORGS_NAME }}" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            PORT_CLEAN=$(echo "${{ vars.PORT }}" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            ACC_TOKEN_CLEAN=$(echo "${{ secrets.ACC_TOKEN }}" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            AUTH_CLIENT_ID_CLEAN=$(echo "${{ secrets.AUTH_CLIENT_ID }}" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            AUTH_CLIENT_SECRET_CLEAN=$(echo "${{ secrets.AUTH_CLIENT_SECRET }}" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            AUTH_CLIENT_URL_CLEAN=$(echo "${{ secrets.AUTH_CLIENT_URL }}" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            ESCAPED_JSON=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | sed ':a;N;$!ba;s/\n/\\n/g')
            echo "Starting new container with image: ${IMAGE_TO_DEPLOY}"
            docker run -d \
              -p "${PORT_CLEAN}":8570 \
              --name "${CONTAINER_NAME}" \
              -e NODE_ENV="${NODE_ENV_CLEAN}" \
              -e ORGS_NAME="${ORGS_NAME_CLEAN}" \
              -e PORT="${PORT_CLEAN}" \
              -e ACC_TOKEN="${ACC_TOKEN_CLEAN}" \
              -e AUTH_CLIENT_ID="${AUTH_CLIENT_ID_CLEAN}" \
              -e AUTH_CLIENT_SECRET="${AUTH_CLIENT_SECRET_CLEAN}" \
              -e AUTH_CLIENT_URL="${AUTH_CLIENT_URL_CLEAN}" \
              -e FIREBASE_SERVICE_ACCOUNT_JSON="${ESCAPED_JSON}" \
              --restart=always \
              "${IMAGE_TO_DEPLOY}"

            echo "Deployment successful for ${IMAGE_TO_DEPLOY}! New container: ${CONTAINER_NAME} on port ${PORT_CLEAN}"
            docker image prune -f
            echo "Old images pruned."